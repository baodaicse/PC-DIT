# CPU-DIT-01 live profile defaults. Values are seconds unless noted otherwise.
SAFE_MEMORY_MIB=256
SAFE_RESERVE_MIB=512
SAFE_MINIMUM_ROUNDS=2
SAFE_MINIMUM_DURATION_SECONDS=120
SAFE_DEADLINE_MARGIN_SECONDS=180

# FULL_SAFE_PERCENT applies after subtracting FULL_RESERVE_MIB from MemAvailable.
FULL_SAFE_PERCENT=95
FULL_RESERVE_MIB=512
FULL_MINIMUM_ROUNDS=4
FULL_MINIMUM_DURATION_SECONDS=1800
FULL_DEADLINE_MARGIN_SECONDS=300

# Telemetry is always collected. CPU temperature auto-abort is operator opt-in.
TEMPERATURE_LIMIT_DEFAULT=off
TEMPERATURE_LIMIT_C=95
