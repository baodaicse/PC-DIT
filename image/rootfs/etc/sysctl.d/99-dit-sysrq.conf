# DIT-01 (docs/FAULT_CATCH_ROADMAP.md, FC1): Magic SysRq for a machine whose test screen stopped
# answering. 240 = 16 sync + 32 remount read-only + 64 signal processes + 128 reboot. Ubuntu's
# default (176) lacks 64: Alt+PrtSc+F, the kernel ending the process holding the most memory.
# Alt+PrtSc+S, U, B: sync, remount read-only, restart.
kernel.sysrq = 240
