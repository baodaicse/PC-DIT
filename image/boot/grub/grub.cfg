set default=fault-attribution
set timeout=8

insmod all_video
insmod part_gpt
insmod fat
insmod linux

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial

set color_normal=white/black
set color_highlight=black/light-gray

# Which build is on this USB. tools/build_boot_image.sh fills the placeholders (local build time
# and image-id); tools/build_iso.sh adds its own line below it. Information only: selecting it
# just reloads this menu. Entries are chosen by --id, so this line does not shift the default.
menuentry "Build @DIT_BUILD_TIME@ | @DIT_IMAGE_ID@" --id build-info {
    configfile /boot/grub/grub.cfg
}

# The control center, with the component fault attribution checks on: GPU boundary checks,
# CPU-RAM and SSD confirmation on failure, so each FAIL is counted on the part that caused it.
# Its results are marked "+ATTRIBUTION" (fail-summary.csv, reports). The default and the only
# control center entry.
menuentry "DIT-01 Fault Attribution (control center + component checks)" --id fault-attribution {
    linux /live/vmlinuz boot=live components toram loglevel=3 live-media-timeout=30 module_blacklist=nouveau cpu_dit_profile=menu dit_attribution=1 fbcon=font:TER10x18 console=tty0
    initrd /live/initrd.img
}

menuentry "DIT-01 CPU-RAM Safe unattended (256 MiB)" {
    linux /live/vmlinuz boot=live components toram loglevel=3 live-media-timeout=30 module_blacklist=nouveau cpu_dit_profile=safe fbcon=font:TER10x18 console=tty0
    initrd /live/initrd.img
}

menuentry "DIT-01 CPU-RAM Full unattended (95% safe RAM, minimum 30 minutes)" {
    linux /live/vmlinuz boot=live components toram loglevel=3 live-media-timeout=30 module_blacklist=nouveau cpu_dit_profile=full fbcon=font:TER10x18 console=tty0
    initrd /live/initrd.img
}

menuentry "DIT-01 Operator shell only (no load)" {
    linux /live/vmlinuz boot=live components toram loglevel=3 live-media-timeout=30 module_blacklist=nouveau cpu_dit_profile=shell fbcon=font:TER10x18 console=tty0
    initrd /live/initrd.img
}

menuentry "Reboot" {
    reboot
}

menuentry "Power off" {
    halt
}
