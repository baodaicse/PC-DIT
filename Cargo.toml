[workspace]
members = [
    "crates/dit-core",
    "crates/dit-system",
    "crates/dit-cli",
    "crates/dit-contracts",
    "crates/dit-source",
    "crates/nvme-io",
    "crates/nvme-inventory",
    "crates/nvme-backend-file",
    "crates/nvme-backend-linux",
    "crates/nvme-engine",
    "crates/nvme-scheduler",
    "crates/dit-ui-core",
    "crates/dit-orchestrator",
    "crates/nvme-cli",
    "crates/gpu-engine",
    "crates/gpu-vulkan",
    "crates/gpu-cuda",
    "crates/gpu-cli",
    "crates/dit-watchdog",
    "crates/dit-chain",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Proprietary"

[workspace.dependencies]
aes = "0.8"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
getrandom = "0.3"
memmap2 = "0.9"
nix = { version = "0.31", features = ["process", "sched"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
wide = "1"
libc = "0.2"
fs2 = "0.4"
terminal_size = "0.4"
ash = "0.38"
ctrlc = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
